<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Integers: Rise and Fall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Everything is laid out on a fixed 1920×1080 stage (Figma frame size)
       and scaled to fit the window by js/game.js → fitStage(). -->
  <div id="viewport">
    <div id="stage">

      <!-- Background (Figma: "ChatGPT Image … 03_26_47 PM (2) 1") -->
      <div id="bg"></div>

      <!-- ============ NUMBER PLATE + KEYPAD (left) ============ -->
      <div id="connector" class="hidden"></div>
      <div id="panel" class="hidden locked">   <!-- locked: not taking keys yet (game.js setPadLive) -->
        <div id="keys">
          <button class="key" data-k="1">1</button>
          <button class="key" data-k="2">2</button>
          <button class="key" data-k="3">3</button>
          <button class="key key--sign" data-k="+">+</button>
          <button class="key" data-k="4">4</button>
          <button class="key" data-k="5">5</button>
          <button class="key" data-k="6">6</button>
          <button class="key key--sign" data-k="-">−</button>
          <button class="key" data-k="7">7</button>
          <button class="key" data-k="8">8</button>
          <button class="key" data-k="9">9</button>
          <button class="key" data-k="0">0</button>
        </div>
        <div id="padActions">
          <button id="btnClear" class="pad-btn pad-btn--clear" aria-label="Clear">⌫</button>
          <button id="btnCheck" class="pad-btn pad-btn--check" data-i18n="check">Check</button>
        </div>
      </div>
      <div id="plate" class="hidden"><span id="plateText">0</span></div>

      <!-- Equation (Level 2/3): sits on top of the keypad in level mode, beside the tank.
           In the Level 2 teaching rows it shows the row's example equation ("1 + 2 = ?"). -->
      <div id="eqPanel" class="hidden" aria-live="polite">
        <span id="eqA"></span><span id="eqOp"></span><span id="eqB"></span><span id="eqEq">=</span><span id="eqAns">?</span>
      </div>

      <!-- ============ TANK + SCALE (right) ============ -->
      <img id="pipeIn" class="pipe" src="assets/pipe-in-dry.png" alt="" draggable="false" />
      <div id="water">
        <div class="caustics" aria-hidden="true"></div>   <!-- light patterns drifting under the surface -->
        <div class="wave wave--back"></div>
        <div class="wave wave--front"></div>
        <div class="glint" aria-hidden="true"></div>      <!-- a bright line running along the surface (moves with the level) -->
        <div class="bubbles"></div>
      </div>
      <!-- Pipe water (CSS + SVG; the pipe images never change): the inlet pours into
           the tank while it fills, the outlet runs while it drains -->
      <div id="streamIn" class="stream pour" aria-hidden="true"><i></i></div>
      <div id="splashIn" aria-hidden="true"><b></b><b></b><i></i><i></i><i></i><i></i></div>
      <img id="tank" src="assets/tank-empty.png" alt="Water tank" draggable="false" />
      <div id="glassShine"></div>
      <svg id="streamOut" class="stream" viewBox="0 0 1920 1080" aria-hidden="true">
        <defs>
          <linearGradient id="outGrad" gradientUnits="userSpaceOnUse" x1="1738" y1="0" x2="1798" y2="0">
            <stop offset="0" stop-color="#1a7fd6" />
            <stop offset=".3" stop-color="#4fb3f2" />
            <stop offset=".45" stop-color="#c4ecff" />
            <stop offset=".58" stop-color="#7fd0fb" />
            <stop offset=".82" stop-color="#2f9be8" />
            <stop offset="1" stop-color="#1569c0" />
          </linearGradient>
          <!-- a gentle wobble on the stream edges, so the water looks liquid -->
          <filter id="liquid" x="-40%" y="-10%" width="180%" height="120%">
            <feTurbulence type="fractalNoise" baseFrequency="0.035 0.09" numOctaves="2" seed="3" result="n">
              <!-- (no animated baseFrequency: re-filtering every frame was costly on slower laptops; QA Bug 3) -->
            </feTurbulence>
            <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G" />
          </filter>
        </defs>
        <g filter="url(#liquid)">
          <path class="flow edge" pathLength="100" d="M1752 978 C1757 1010 1765 1045 1774 1100" />
          <path class="flow" pathLength="100" d="M1752 978 C1757 1010 1765 1045 1774 1100" />
          <path class="streak" d="M1745 978 C1750 1010 1758 1045 1767 1100" />
        </g>
        <circle class="drop" cx="1766" cy="1000" r="5" style="--dx: 22px" />
        <circle class="drop" cx="1748" cy="1004" r="4" style="--dx: -16px" />
        <circle class="drop" cx="1772" cy="1012" r="3.5" style="--dx: 30px" />
      </svg>
      <img id="pipeOut" class="pipe" src="assets/pipe-out-dry.png" alt="" draggable="false" />

      <div id="track"></div>
      <div id="rail"></div>
      <div id="scaleClip"><div id="scaleStrip"></div></div>
      <div id="countLine"></div>

      <button id="btnUp" class="lever-btn" aria-label="Move marker up"></button>
      <button id="btnDown" class="lever-btn" aria-label="Move marker down"></button>

      <div id="marker" role="slider" aria-label="Water level marker" tabindex="0">
        <svg viewBox="0 0 140 40" width="140" height="40" aria-hidden="true">
          <defs>
            <filter id="mGlow" x="-30%" y="-80%" width="160%" height="260%">
              <feGaussianBlur stdDeviation="3" result="b" />
              <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
            </filter>
          </defs>
          <g filter="url(#mGlow)">
            <rect x="4" y="16" width="96" height="8" rx="4" fill="#FFE11A" />
            <path d="M92 4 L132 20 L92 36 Z" fill="#FFE11A" stroke="#E0A800" stroke-width="2" stroke-linejoin="round" />
          </g>
        </svg>
        <span class="marker-grip"></span>
      </div>

      <!-- ============ NARRATOR ============ -->
      <!-- Full-size Guddu (guided steps): a soft light behind him, and his line in the story's
           speech bubble beside his head while he talks (the narrator box steps aside) -->
      <div id="charGlow" aria-hidden="true"></div>
      <div id="character" role="img" aria-label="Guddu Bhaiya"><div class="art"></div></div>
      <div id="hostBubble" aria-hidden="true"><img alt="" draggable="false" /><p></p></div>
      <div id="banner">
        <div id="avatar" aria-hidden="true"></div>
        <p id="bannerText"></p>
      </div>

      <!-- Transition gate button -->
      <button id="gateBtn" class="big-btn hidden">Start</button>

      <!-- ============ FOCUS LAYER (frosted glass + spotlight holes) ============ -->
      <div id="focus"></div>
      <div id="focusHit"></div>   <!-- invisible: blocks taps outside the spotlight (the soft mask on #focus does not) -->
      <div class="focus-ring" id="ring0"></div>
      <div class="focus-ring" id="ring1"></div>
      <div class="focus-ring" id="ring2"></div>

      <!-- Tutorial demo hand -->
      <div id="hand" aria-hidden="true">👆</div>

      <!-- ============ FEEDBACK FX ============ -->
      <div id="fxLayer"></div>
      <div id="markedBadge"><span></span></div>
      <!-- Story end: "completion badge" -->
      <div id="medal" aria-hidden="true"><span>★</span></div>
      <canvas id="confetti" width="1920" height="1080"></canvas>

      <!-- ============ STORY (full-screen scenes before How to Play) ============ -->
      <div id="story" class="hidden" aria-live="polite">
        <div class="shot"><img alt="" draggable="false" /><div class="spots"></div></div>
        <div class="shot"><img alt="" draggable="false" /><div class="spots"></div></div>
        <p id="caption"></p>
        <div id="bubble"><img alt="" draggable="false" /><p id="bubbleText"></p></div>
      </div>

      <!-- ============ HUD ============ -->
      <!-- ⏸ / ▶ pause toggle and ⏮ back a step (story and game): game.js "Pause" -->
      <button id="btnPause" class="hud-btn" aria-label="Pause">
        <svg class="ico-pause" viewBox="0 0 48 48" aria-hidden="true"><rect x="13" y="11" width="8.5" height="26" rx="3" fill="#0d3b8c"/><rect x="26.5" y="11" width="8.5" height="26" rx="3" fill="#0d3b8c"/></svg>
        <svg class="ico-play" viewBox="0 0 48 48" aria-hidden="true"><path d="M16 11.5v25a2.5 2.5 0 0 0 3.8 2.1l19.5-12.5a2.5 2.5 0 0 0 0-4.2L19.8 9.4A2.5 2.5 0 0 0 16 11.5z" fill="#0d3b8c"/></svg>
      </button>
      <button id="btnStoryBack" class="hud-btn" aria-label="Go back a step">
        <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="9" y="12" width="6" height="24" rx="2.5" fill="#0d3b8c"/><path d="M38 13.6v20.8a2 2 0 0 1-3.1 1.7L19.3 25.7a2 2 0 0 1 0-3.4l15.6-10.4a2 2 0 0 1 3.1 1.7z" fill="#0d3b8c"/></svg>
      </button>
      <!-- look back at the lines spoken so far (game.js "Look back"): icons only -->
      <button id="btnBack" class="hud-btn off" aria-label="Look back at what was said">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 10h32a5 5 0 0 1 5 5v16a5 5 0 0 1-5 5H22l-9 7v-7H8a5 5 0 0 1-5-5V15a5 5 0 0 1 5-5z" fill="#fff" stroke="#0d3b8c" stroke-width="3" stroke-linejoin="round"/><path d="M27 16l-8 7 8 7" fill="none" stroke="#0d3b8c" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <!-- language: shows the language in use; a tap switches in place (js/lang.js) -->
      <button id="btnLang" class="hud-btn" aria-label="Language">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="#0d3b8c" stroke-width="2"/><path d="M3 12h18M12 3c2.6 2.6 3.6 5.6 3.6 9S14.6 18.4 12 21M12 3C9.4 5.6 8.4 8.6 8.4 12s1 6.4 3.6 9" fill="none" stroke="#0d3b8c" stroke-width="2"/></svg>
        <b data-i18n="langName">English</b>
      </button>
      <button id="btnMute" class="hud-btn" aria-label="Mute sound">🔊</button>
      <div id="voiceWait" aria-hidden="true"></div>   <!-- a ring around 🔊 while a voice line is still loading (slow network) -->
      <button id="btnJump" class="hud-btn hidden" aria-label="QA level jumper">⏭</button>
      <div id="progress"></div>
      <!-- QA level jumper (config.qaJumper) -->
      <div id="jumper" class="hidden">
        <div class="jumper-card">
          <div class="jumper-head"><b>QA · Jump to</b><button id="jumpClose" aria-label="Close">✕</button></div>
          <div id="jumpList"></div>
        </div>
      </div>

      <!-- the game waits: ⏸ when the window lost focus; ▶ to play on after the ⏸ button (.user) -->
      <div id="paused" class="hidden" role="status" aria-label="Paused">
        <div class="paused-icon">⏸</div>
        <button id="btnResume" aria-label="Play">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M17 10.5v27a2.5 2.5 0 0 0 3.8 2.1l21-13.5a2.5 2.5 0 0 0 0-4.2l-21-13.5A2.5 2.5 0 0 0 17 10.5z" fill="#0d3b8c"/></svg>
        </button>
      </div>

      <!-- Look back: one earlier line at a time, with its voice (the game holds meanwhile) -->
      <div id="review" class="hidden" role="dialog" aria-label="What was said">
        <div class="review-card">
          <button id="revClose" class="rev-btn rev-close" aria-label="Back to the game">✕</button>
          <div class="review-line">
            <div id="revFace" aria-hidden="true"></div>
            <div class="review-words"><p id="revText"></p><p id="revNote" class="hidden"></p></div>
          </div>
          <div class="review-nav">
            <button id="revPrev" class="rev-btn" aria-label="Earlier line">◀</button>
            <button id="revPlay" class="rev-btn rev-play" aria-label="Hear it again">🔊</button>
            <button id="revNext" class="rev-btn" aria-label="Later line">▶</button>
          </div>
        </div>
      </div>

      <!-- ============ SCREENS ============ -->
      <!-- Chapter break (story ↔ game): the screen floods, a title card floats up, the water drains away -->
      <div id="flood" class="hidden" aria-live="polite">
        <div class="flood-water"><div class="wave wave--back"></div><div class="wave wave--front"></div><div class="bubbles"></div></div>
        <div class="flood-card"><h2></h2><button id="floodGo" class="big-btn" aria-label="Start">▶</button></div>
      </div>

      <!-- Cover (Gemini "Nano Banana Pro" key art, assets/cover.jpg): the title on the open sky, Start below it -->
      <div id="startScreen" class="cover">
        <div class="cover-art" aria-hidden="true"></div>
        <div class="cover-shine" aria-hidden="true"></div>
        <div class="cover-bubbles" aria-hidden="true"></div>
        <div class="cover-title">
          <h1 data-i18n="title">Integers<br /><span>Rise and Fall</span></h1>
          <div id="qaStartTag" class="hidden"></div>
          <button id="btnStart" class="cover-btn loading" aria-label="Start" disabled><i class="play" aria-hidden="true"></i><b data-i18n="start">Start</b><span class="load-ring" aria-hidden="true"></span></button>
        </div>
      </div>
      <!-- End: the cover art again, with the completion badge and a replay button -->
      <div id="endScreen" class="cover end hidden">
        <div class="cover-art" aria-hidden="true"></div>
        <div class="cover-shine" aria-hidden="true"></div>
        <div class="cover-title">
          <div class="end-medal" aria-hidden="true"><span>★</span></div>
          <h1 data-i18n="title">Integers<br /><span>Rise and Fall</span></h1>
          <button id="btnReplay" class="cover-btn round" aria-label="Play again"><span aria-hidden="true">↻</span></button>
        </div>
      </div>

    </div>
  </div>

  <!-- Size the stage at once, before the game scripts load: until then it would show at its full
       1920 × 1080 (a zoomed-in flash). game.js keeps it fitted from here on (fitStage). -->
  <script>
    (function () {
      var st = document.getElementById("stage"), W = innerWidth, H = innerHeight, s = Math.min(W / 1920, H / 1080);
      if (window.CSS && CSS.supports && CSS.supports("zoom", "0.5")) { st.classList.add("zoomed"); st.style.zoom = s; }
      else st.style.transform = "translate(" + (W - 1920 * s) / 2 + "px, " + (H - 1080 * s) / 2 + "px) scale(" + s + ")";
      document.documentElement.classList.add("fitted");
    })();
  </script>

  <!-- Phone held upright: the 16:9 game would be a thin strip, so ask to turn it (icon only) -->
  <div id="rotate" role="img" aria-label="Turn your phone sideways"><div class="phone"></div></div>


  <script src="js/data.js"></script>
  <script src="js/lang-hi.js"></script>  <!-- Hindi lines -->
  <script src="js/lang.js"></script>     <!-- English / Hindi: swaps the lines before the game starts -->
  <script src="assets/vo/manifest.js"></script>  <!-- recorded voice-over clips (tools/generate-audio.mjs) -->
  <script src="assets/vo/lipsync.js"></script>   <!-- how loud each clip is, for the mouths (tools/make-lipsync.mjs) -->
  <script src="js/fx.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
